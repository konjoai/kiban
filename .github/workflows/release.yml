name: Release

# Cut a GitHub release straight from VERSION + CHANGELOG.md, with the changelog
# as the single source of truth for the notes. Runs when VERSION lands on main, or on
# manual dispatch; it is idempotent, so re-running once the release exists is a no-op.
#
# The tag is a signed, annotated tag we create and push ourselves -- `gh release
# create`'s server-side tag creation (the old approach) only ever produces a
# lightweight, unsigned tag, which is what `security/allowed_signers` and
# `lib/self_update.sh`'s verify-before-apply step exist to close off. The tagger
# identity (`release@kiban`) must match the principal in `security/allowed_signers`;
# git's ssh verification matches on that, not on the key's comment.

on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.v.outputs.tag }} already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        run: |
          version="${{ steps.v.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi
          echo "Release notes for $version:"
          cat release-notes.md

      - name: Sign and push the release tag
        if: steps.check.outputs.exists == 'false'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "RELEASE_SIGNING_KEY secret is not set; cannot cut a signed release tag." >&2
            echo "See docs/DISTRIBUTION.md for how to provision it." >&2
            exit 1
          fi
          keyfile="$RUNNER_TEMP/release_signing_key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keyfile"
          chmod 600 "$keyfile"

          tag="${{ steps.v.outputs.tag }}"
          git config user.email "release@kiban"
          git config user.name "kiban-release"
          git config gpg.format ssh
          git config user.signingkey "$keyfile"
          git tag -s -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "$tag"

          rm -f "$keyfile"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file release-notes.md
