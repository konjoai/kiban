# profiles/_schema.yml
# The profile schema every consuming repo fills. A profile tells the CI-plane runner
# which gates and specialist lanes apply to that repo's stack. The runner reads the
# repo's own .konjo/profile.yml; it never reads ~/.konjo.
#
# This file documents the shape. It is not itself a profile.

repo: string                # the repo name, e.g. "squish"

stack:                      # languages/runtimes present, drives lane selection
  - string                  # e.g. mlx, python, swift, rust, mojo, ts

format_lint:                # formatters and linters run on every change
  - string                  # e.g. ruff, black, shellcheck, clippy, eslint

contract_gates:             # the blocking correctness contracts for this repo
  - string                  # e.g. dtype, shape, squizd-format, http-api-surface

mutation: string            # mutation-testing tool, or "none-with-reason: <reason>"

specialists:                # review lanes (advisory until promoted by specialist_stats)
  - string                  # e.g. numerics, memory-bandwidth, concurrency, api-surface

prove:                      # the perf prove gate (runs locally on bench hardware)
  enabled: bool             # true to run the prove gate
  baseline: string          # tagged golden baseline konjo-prove compares against
  metric: string            # the measured metric name, e.g. e2e_response_s
  unit: string              # the metric unit, e.g. s
  lower_is_better: bool     # true for latency/time, false for throughput
  min_effect: float         # minimum absolute median improvement to MERGE (metric units)
  min_effect_pct: float     # OR the minimum effect as a percent of the baseline median
  run_floor: int            # minimum paired runs before a verdict (default 30)
  perf_globs:               # paths that mark a change as perf-labeled for the CI gate
    - string                # e.g. "benchmarks/**"
  bench_cmd: string         # the command a maintainer runs to produce the paired artifact

longrun_globs:              # paths whose scripts must wire the resume contract (Phase 9)
  - string                  # e.g. "benchmarks/**", "**/bench_*.py"; default set if omitted

polarity:                   # G-POLARITY (K1): no unknown path returns a passing value
  enabled: bool              # false to skip entirely (default true)
  tier: string               # Adoption-Ramp-1: "blocking" or "advisory" (default:
                             # "advisory"); preferred over `advisory:` below
  advisory: bool             # DEPRECATED ALIAS for `tier:` (true == advisory, false ==
                             # blocking) -- kept working so existing profiles don't
                             # break; default true for a repo backfilling this gate,
                             # false (or `tier: blocking`) for one that has cleaned its
                             # baseline
  exempt_globs: [string]     # paths where the shape is legitimate; state the reason in
                             # the profile comment next to the glob, not just the glob

gates:                       # G-CAN-FAIL (K1): every quality gate names its rejecting test
  - name: string             # the gate's name, as it appears in this repo's own CI
    rejects_test: string     # a command that supplies a known-bad input and asserts
                             # REJECTION; konjo-gates runs it and requires it to pass
    tier: string             # Adoption-Ramp-1: "blocking" or "advisory" (default:
                             # "advisory"). The general form of the `advisory: bool`
                             # flags below -- may be declared here for a gate with no
                             # dedicated profile sub-block, or directly on a gate's own
                             # sub-block (e.g. `polarity: {tier: ...}`). A gate may be
                             # promoted to `tier: blocking` only once it meets BOTH
                             # promotion criteria: a passing `rejects_test` above, and a
                             # measured false-positive rate below a stated ceiling over
                             # at least N runs (see lib/gate_stats.py). konjo-gates'
                             # `gate_can_fail` meta-gate fails a profile that declares
                             # `tier: blocking` without a passing `rejects_test` --
                             # a gate that cannot demonstrate it can fail must not be
                             # allowed to block.

claude_contract:             # Phase 13, Phase 1: the CLAUDE.md section contract
  enabled: bool               # false to skip entirely (default true)
  tier: string                 # Adoption-Ramp-1: "blocking" or "advisory" (default:
                               # "advisory"); preferred over `advisory:` below
  advisory: bool               # DEPRECATED ALIAS for `tier:` (true == advisory, false
                               # == blocking) -- kept working so existing profiles don't
                               # break; default true for a repo backfilling this gate,
                               # false (or `tier: blocking`) once its CLAUDE.md is
                               # brought into contract

security_globs:               # Phase 13, Phase 3: paths gate_threat_model treats as
                              # crossing a trust boundary -- authn/authz, secret lifecycle,
                              # deserialization, subprocess/exec, path handling, network
                              # ingress, SQL construction, resource limits
  - string                    # e.g. "**/api*", "**/webhook*", "**/auth*"; default set if omitted

verify_cmd: string          # how the agent verifies its own work (Phase 10): the test/bench/
                            # browser path to run before claiming done. A missing one warns.

format_cmd: string          # the repo's formatter (Phase 11): run by the optional PostToolUse
                            # format hook after an edit. Optional; the hook no-ops if absent.

context_budget_tokens: int  # ceiling for the always-on context in estimated tokens (Phase 12;
                            # default 1500). The context-budget gate warns over it.
skill_line_cap: int         # per-SKILL.md line cap (Phase 12; default 80). A skill over it
                            # needs a `konjo-skill-size-ok:` justification or the gate warns.

killtest: bool              # require a kill-test before a sprint starts

overrides:                  # per-repo escape hatches, each with a reason
  map: any                  # key -> { value, reason }
